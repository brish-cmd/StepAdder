name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
        shell: bash
      # On failure, publish the build log on a "build-log" branch for debugging.
      - if: failure()
        run: |
          mkdir logout && cp build.log logout/ && cd logout
          git init -q -b build-log && git add build.log
          git -c user.name=ci -c user.email=ci@localhost commit -qm "log ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" build-log
      - run: cp app/build/outputs/apk/release/app-release.apk StepAdder.apk
      - uses: actions/upload-artifact@v5
        with:
          name: StepAdder-apk
          path: StepAdder.apk
      # Also publish the APK on an "apk" branch so it can be pulled with plain git.
      - run: |
          mkdir out && cp StepAdder.apk out/ && cd out
          git init -q -b apk && git add StepAdder.apk
          git -c user.name=ci -c user.email=ci@localhost commit -qm "APK from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk
